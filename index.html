<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>배당성장 트래커</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #0a0e1a; font-family: 'Noto Sans KR', sans-serif; }
  input { outline: none; }
  button { outline: none; }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const INITIAL_STOCKS = [
  { id: 1, name: "삼성전자", ticker: "005930", shares: 50, avgPrice: 72000,
    dividends: { 2020: 1416, 2021: 1444, 2022: 1444, 2023: 1444, 2024: 1444 } },
  { id: 2, name: "KB금융", ticker: "105560", shares: 30, avgPrice: 58000,
    dividends: { 2020: 1770, 2021: 2190, 2022: 2950, 2023: 3060, 2024: 3540 } },
  { id: 3, name: "한국전력", ticker: "015760", shares: 100, avgPrice: 22000,
    dividends: { 2020: 0, 2021: 0, 2022: 0, 2023: 0, 2024: 0 } },
];
const INITIAL_GOALS = { annualDividend: 5000000, cash: 10000000, targetCash: 50000000 };
const YEARS = [2020, 2021, 2022, 2023, 2024];

function loadData(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}
function saveData(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

function calcGrowthRate(dividends) {
  const vals = YEARS.map(y => dividends[y] || 0);
  const nonZero = vals.filter(v => v > 0);
  if (nonZero.length < 2) return null;
  const first = nonZero[0], last = nonZero[nonZero.length - 1];
  return ((Math.pow(last / first, 1 / (nonZero.length - 1)) - 1) * 100);
}
function getStatus(dividends) {
  const vals = YEARS.map(y => dividends[y] || 0);
  const recent = vals.slice(-3).filter(v => v > 0);
  if (recent.length < 2) return "데이터부족";
  if (recent.every((v, i) => i === 0 || v >= recent[i - 1])) return "성장";
  if (recent.every((v, i) => i === 0 || v <= recent[i - 1])) return "감소";
  return "정체";
}
const STATUS_STYLE = {
  성장:    { bg: "#0d3b2e", text: "#22c979", border: "#22c979" },
  감소:    { bg: "#3b0d0d", text: "#f06060", border: "#f06060" },
  정체:    { bg: "#2e2a0d", text: "#d4b94a", border: "#d4b94a" },
  데이터부족: { bg: "#1a1a2e", text: "#888", border: "#444" },
};

function MiniChart({ dividends, shares }) {
  const vals = YEARS.map(y => (dividends[y] || 0) * shares);
  const max = Math.max(...vals, 1);
  const w = 120, h = 40;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * w},${h - (v / max) * (h - 6) - 2}`).join(" ");
  const color = vals[vals.length - 1] >= vals[0] ? "#22c979" : "#f06060";
  const uid = `g${vals.join("")}`;
  return (
    <svg width={w} height={h} style={{ overflow: "visible" }}>
      <defs>
        <linearGradient id={uid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.3" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <polygon points={`0,${h} ${pts} ${w},${h}`} fill={`url(#${uid})`} />
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" />
      {vals.map((v, i) => (
        <circle key={i} cx={(i / (vals.length - 1)) * w}
          cy={h - (v / max) * (h - 6) - 2} r="3" fill={color} />
      ))}
    </svg>
  );
}

function SaveToast({ show }) {
  return (
    <div style={{
      position: "fixed", top: 24, left: "50%",
      transform: `translateX(-50%) translateY(${show ? 0 : -60}px)`,
      background: "#22c979", color: "#0a0e1a", borderRadius: 999,
      padding: "8px 20px", fontSize: 12, fontWeight: 800, zIndex: 9999,
      transition: "transform 0.3s ease", boxShadow: "0 4px 20px #22c97966",
      pointerEvents: "none",
    }}>✓ 저장되었습니다</div>
  );
}

function App() {
  const [stocks, setStocks]       = useState(() => loadData("div-stocks", INITIAL_STOCKS));
  const [goals, setGoals]         = useState(() => loadData("div-goals", INITIAL_GOALS));
  const [tab, setTab]             = useState("dashboard");
  const [editGoals, setEditGoals] = useState(false);
  const [showAdd, setShowAdd]     = useState(false);
  const [editStock, setEditStock] = useState(null);
  const [goalDraft, setGoalDraft] = useState(goals);
  const [toast, setToast]         = useState(false);
  const [newStock, setNewStock]   = useState({ name:"", ticker:"", shares:"", avgPrice:"", dividends:{} });

  useEffect(() => { saveData("div-stocks", stocks); }, [stocks]);
  useEffect(() => { saveData("div-goals", goals); }, [goals]);

  const showToast = () => { setToast(true); setTimeout(() => setToast(false), 2000); };

  const totalAnnualDividend = stocks.reduce((s, st) => s + (st.dividends[2024] || 0) * st.shares, 0);
  const totalInvested       = stocks.reduce((s, st) => s + st.avgPrice * st.shares, 0);
  const avgYield            = totalInvested > 0 ? (totalAnnualDividend / totalInvested) * 100 : 0;
  const progressDividend    = Math.min((totalAnnualDividend / (goals.annualDividend || 1)) * 100, 100);
  const progressCash        = Math.min((goals.cash / (goals.targetCash || 1)) * 100, 100);
  const fmt                 = n => n?.toLocaleString("ko-KR");
  const inp                 = (accent) => ({
    width:"100%", background:"#0d1528", border:`1px solid ${accent||"#1d2f50"}`,
    borderRadius:8, padding:"8px 12px", color:"#e8eaf0", fontSize:13, boxSizing:"border-box",
  });

  function handleAddStock() {
    const filled = { ...newStock.dividends };
    YEARS.forEach(y => { if (!filled[y]) filled[y] = 0; });
    setStocks([...stocks, { ...newStock, id: Date.now(),
      shares: Number(newStock.shares), avgPrice: Number(newStock.avgPrice), dividends: filled }]);
    setNewStock({ name:"", ticker:"", shares:"", avgPrice:"", dividends:{} });
    setShowAdd(false); showToast();
  }
  function handleEditSave() {
    setStocks(stocks.map(s => s.id === editStock.id
      ? { ...editStock, shares: Number(editStock.shares), avgPrice: Number(editStock.avgPrice) } : s));
    setEditStock(null); showToast();
  }
  function handleDelete(id) { setStocks(stocks.filter(s => s.id !== id)); showToast(); }

  const C = { bg:"#0a0e1a", card:"#111e38", border:"#1d2f50", dim:"#0d1528",
              blue:"#4a90d9", green:"#22c979", yellow:"#d4b94a", red:"#f06060" };

  return (
    <div style={{ minHeight:"100vh", background:C.bg, color:"#e8eaf0",
      fontFamily:"'Noto Sans KR',sans-serif", maxWidth:480, margin:"0 auto", paddingBottom:80 }}>
      <SaveToast show={toast} />

      {/* Header */}
      <div style={{ background:"linear-gradient(135deg,#0d1528,#0a1a35)",
        padding:"32px 20px 18px", borderBottom:`1px solid ${C.border}`,
        position:"sticky", top:0, zIndex:100 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div>
            <div style={{ fontSize:10, letterSpacing:3, color:C.blue, marginBottom:4 }}>배당성장 트래커</div>
            <div style={{ fontSize:21, fontWeight:800, letterSpacing:-0.5 }}>내 배당 포트폴리오</div>
            <div style={{ fontSize:10, color:"#3a5a80", marginTop:3 }}>💾 데이터 자동저장</div>
          </div>
          <div style={{ background:C.card, borderRadius:12, padding:"8px 14px",
            textAlign:"right", border:`1px solid ${C.border}` }}>
            <div style={{ fontSize:10, color:"#8899bb" }}>연간 배당 예상</div>
            <div style={{ fontSize:18, fontWeight:800, color:C.green }}>₩{fmt(totalAnnualDividend)}</div>
          </div>
        </div>
      </div>

      {/* Tabs */}
      <div style={{ display:"flex", background:C.dim, borderBottom:`1px solid ${C.border}`,
        position:"sticky", top:90, zIndex:99 }}>
        {[["dashboard","📊 대시보드"],["stocks","📈 종목관리"],["goals","🎯 목표설정"]].map(([key,label]) => (
          <button key={key} onClick={() => setTab(key)} style={{
            flex:1, padding:"12px 0", background:"none", border:"none",
            color: tab===key ? C.blue : "#5a7090", fontSize:12,
            fontWeight: tab===key ? 700 : 400, cursor:"pointer",
            borderBottom: tab===key ? `2px solid ${C.blue}` : "2px solid transparent",
            transition:"all 0.2s",
          }}>{label}</button>
        ))}
      </div>

      {/* ── DASHBOARD ── */}
      {tab==="dashboard" && (
        <div style={{ padding:16 }}>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:16 }}>
            {[
              { label:"총 투자금액",    value:`₩${fmt(totalInvested)}`,   color:C.blue   },
              { label:"평균 배당수익률", value:`${avgYield.toFixed(2)}%`,  color:C.green  },
              { label:"보유 현금",      value:`₩${fmt(goals.cash)}`,      color:C.yellow },
              { label:"보유 종목 수",   value:`${stocks.length}개`,        color:"#c97aff"},
            ].map(({label,value,color}) => (
              <div key={label} style={{ background:C.card, borderRadius:14,
                padding:"14px 16px", border:`1px solid ${C.border}` }}>
                <div style={{ fontSize:10, color:"#6a8aaa", marginBottom:6 }}>{label}</div>
                <div style={{ fontSize:16, fontWeight:800, color }}>{value}</div>
              </div>
            ))}
          </div>

          {/* Dividend progress */}
          <div style={{ background:C.card, borderRadius:14, padding:16, marginBottom:12, border:`1px solid ${C.border}` }}>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:10 }}>
              <div>
                <div style={{ fontSize:11, color:"#6a8aaa" }}>연간 배당 목표 달성률</div>
                <div style={{ fontSize:13, fontWeight:700, marginTop:2 }}>
                  ₩{fmt(totalAnnualDividend)} / ₩{fmt(goals.annualDividend)}
                </div>
              </div>
              <div style={{ fontSize:24, fontWeight:900, color:C.green }}>{progressDividend.toFixed(1)}%</div>
            </div>
            <div style={{ background:"#1a2a45", borderRadius:999, height:10, overflow:"hidden" }}>
              <div style={{ width:`${progressDividend}%`, height:"100%",
                background:"linear-gradient(90deg,#22c979,#4a90d9)",
                borderRadius:999, transition:"width 0.6s ease" }} />
            </div>
            <div style={{ fontSize:10, color:"#5a7090", marginTop:6 }}>
              월 평균 ₩{fmt(Math.round(totalAnnualDividend/12))} 예상
            </div>
          </div>

          {/* Cash progress */}
          <div style={{ background:C.card, borderRadius:14, padding:16, marginBottom:16, border:`1px solid ${C.border}` }}>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:10 }}>
              <div>
                <div style={{ fontSize:11, color:"#6a8aaa" }}>현금 목표 달성률</div>
                <div style={{ fontSize:13, fontWeight:700, marginTop:2 }}>
                  ₩{fmt(goals.cash)} / ₩{fmt(goals.targetCash)}
                </div>
              </div>
              <div style={{ fontSize:24, fontWeight:900, color:C.yellow }}>{progressCash.toFixed(1)}%</div>
            </div>
            <div style={{ background:"#1a2a45", borderRadius:999, height:10, overflow:"hidden" }}>
              <div style={{ width:`${progressCash}%`, height:"100%",
                background:"linear-gradient(90deg,#d4b94a,#f09040)",
                borderRadius:999, transition:"width 0.6s ease" }} />
            </div>
          </div>

          <div style={{ fontSize:11, color:"#6a8aaa", marginBottom:10, letterSpacing:1 }}>종목별 배당 현황</div>
          {stocks.map(stock => {
            const status = getStatus(stock.dividends);
            const st = STATUS_STYLE[status];
            const cagr = calcGrowthRate(stock.dividends);
            const lastDiv = stock.dividends[2024] || 0;
            return (
              <div key={stock.id} style={{ background:C.card, borderRadius:16,
                padding:16, marginBottom:12, border:`1px solid ${st.border}22` }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:10 }}>
                  <div>
                    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
                      <span style={{ fontSize:15, fontWeight:800 }}>{stock.name}</span>
                      <span style={{ fontSize:10, fontWeight:700, padding:"2px 8px", borderRadius:999,
                        background:st.bg, color:st.text, border:`1px solid ${st.border}55` }}>{status}</span>
                    </div>
                    <div style={{ fontSize:11, color:"#6a8aaa" }}>{stock.ticker} · {stock.shares}주</div>
                  </div>
                  <div style={{ textAlign:"right" }}>
                    <div style={{ fontSize:16, fontWeight:800, color:C.green }}>₩{fmt(lastDiv * stock.shares)}</div>
                    <div style={{ fontSize:10, color:"#6a8aaa" }}>연간 배당</div>
                  </div>
                </div>
                <MiniChart dividends={stock.dividends} shares={stock.shares} />
                <div style={{ display:"flex", gap:14, marginTop:10 }}>
                  <div style={{ fontSize:11, color:"#8899bb" }}>
                    주당: <span style={{ color:"#e8eaf0", fontWeight:600 }}>₩{fmt(lastDiv)}</span>
                  </div>
                  {cagr !== null && (
                    <div style={{ fontSize:11, color:"#8899bb" }}>
                      CAGR: <span style={{ color: cagr>=0 ? C.green : C.red, fontWeight:700 }}>
                        {cagr>=0?"+":""}{cagr.toFixed(1)}%
                      </span>
                    </div>
                  )}
                </div>
                <div style={{ display:"flex", gap:6, marginTop:12, overflowX:"auto" }}>
                  {YEARS.map((y,i) => {
                    const prev = i>0 ? (stock.dividends[YEARS[i-1]]||0) : null;
                    const cur  = stock.dividends[y]||0;
                    const up   = prev!==null && cur>prev;
                    const down = prev!==null && cur<prev;
                    return (
                      <div key={y} style={{ flex:"0 0 auto", background:C.dim, borderRadius:8,
                        padding:"6px 10px", minWidth:56,
                        border:`1px solid ${up?"#22c97444":down?"#f0606044":C.border}` }}>
                        <div style={{ fontSize:9, color:"#5a7090" }}>{y}</div>
                        <div style={{ fontSize:12, fontWeight:700,
                          color: up?C.green:down?C.red:"#c8d0e0" }}>
                          {cur>0?`₩${fmt(cur)}`:"-"}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── STOCKS ── */}
      {tab==="stocks" && (
        <div style={{ padding:16 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
            <div style={{ fontSize:14, fontWeight:700 }}>보유 종목</div>
            <button onClick={() => setShowAdd(true)} style={{
              background:"linear-gradient(135deg,#4a90d9,#22c979)", border:"none",
              borderRadius:999, padding:"8px 18px", color:"#fff", fontSize:12,
              fontWeight:700, cursor:"pointer" }}>+ 종목 추가</button>
          </div>

          {showAdd && (
            <div style={{ background:C.card, borderRadius:16, padding:18,
              marginBottom:16, border:`1px solid #4a90d944` }}>
              <div style={{ fontSize:13, fontWeight:700, color:C.blue, marginBottom:14 }}>새 종목 추가</div>
              {[["name","종목명"],["ticker","종목코드"],["shares","보유주수"],["avgPrice","평균매입가"]].map(([k,l]) => (
                <div key={k} style={{ marginBottom:10 }}>
                  <div style={{ fontSize:10, color:"#6a8aaa", marginBottom:4 }}>{l}</div>
                  <input value={newStock[k]} onChange={e => setNewStock({...newStock,[k]:e.target.value})}
                    style={inp()} />
                </div>
              ))}
              <div style={{ fontSize:11, color:"#6a8aaa", marginBottom:8 }}>연도별 주당 배당금</div>
              <div style={{ display:"flex", gap:6, marginBottom:14 }}>
                {YEARS.map(y => (
                  <div key={y} style={{ flex:1 }}>
                    <div style={{ fontSize:9, color:"#5a7090", marginBottom:2 }}>{y}</div>
                    <input value={newStock.dividends[y]||""}
                      onChange={e => setNewStock({...newStock,dividends:{...newStock.dividends,[y]:Number(e.target.value)}})}
                      style={{ ...inp(), padding:"6px 4px", fontSize:11 }} />
                  </div>
                ))}
              </div>
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={handleAddStock} style={{
                  flex:1, background:"linear-gradient(135deg,#4a90d9,#22c979)", border:"none",
                  borderRadius:10, padding:10, color:"#fff", fontWeight:700, cursor:"pointer", fontSize:13,
                }}>추가 & 저장</button>
                <button onClick={() => setShowAdd(false)} style={{
                  flex:1, background:"#1a2a45", border:"none", borderRadius:10, padding:10,
                  color:"#8899bb", fontWeight:700, cursor:"pointer", fontSize:13,
                }}>취소</button>
              </div>
            </div>
          )}

          {stocks.map(stock => {
            const status = getStatus(stock.dividends);
            const st = STATUS_STYLE[status];
            const isEdit = editStock?.id === stock.id;
            return (
              <div key={stock.id} style={{ background:C.card, borderRadius:16,
                padding:16, marginBottom:12, border:`1px solid ${C.border}` }}>
                {isEdit ? (
                  <div>
                    <div style={{ fontSize:12, color:C.blue, fontWeight:700, marginBottom:12 }}>종목 수정</div>
                    {[["name","종목명"],["ticker","종목코드"],["shares","보유주수"],["avgPrice","평균매입가"]].map(([k,l]) => (
                      <div key={k} style={{ marginBottom:8 }}>
                        <div style={{ fontSize:10, color:"#6a8aaa", marginBottom:3 }}>{l}</div>
                        <input value={editStock[k]} onChange={e => setEditStock({...editStock,[k]:e.target.value})}
                          style={inp()} />
                      </div>
                    ))}
                    <div style={{ fontSize:11, color:"#6a8aaa", marginBottom:6 }}>연도별 주당 배당금</div>
                    <div style={{ display:"flex", gap:6, marginBottom:12 }}>
                      {YEARS.map(y => (
                        <div key={y} style={{ flex:1 }}>
                          <div style={{ fontSize:9, color:"#5a7090", marginBottom:2 }}>{y}</div>
                          <input value={editStock.dividends[y]||0}
                            onChange={e => setEditStock({...editStock,dividends:{...editStock.dividends,[y]:Number(e.target.value)}})}
                            style={{ ...inp(), padding:"6px 4px", fontSize:11 }} />
                        </div>
                      ))}
                    </div>
                    <div style={{ display:"flex", gap:8 }}>
                      <button onClick={handleEditSave} style={{
                        flex:1, background:"linear-gradient(135deg,#4a90d9,#22c979)", border:"none",
                        borderRadius:10, padding:9, color:"#fff", fontWeight:700, cursor:"pointer", fontSize:13,
                      }}>저장</button>
                      <button onClick={() => setEditStock(null)} style={{
                        flex:1, background:"#1a2a45", border:"none", borderRadius:10, padding:9,
                        color:"#8899bb", fontWeight:700, cursor:"pointer", fontSize:13,
                      }}>취소</button>
                    </div>
                  </div>
                ) : (
                  <div>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                      <div>
                        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                          <span style={{ fontSize:15, fontWeight:800 }}>{stock.name}</span>
                          <span style={{ fontSize:10, fontWeight:700, padding:"2px 8px", borderRadius:999,
                            background:st.bg, color:st.text, border:`1px solid ${st.border}55` }}>{status}</span>
                        </div>
                        <div style={{ fontSize:11, color:"#6a8aaa", marginTop:3 }}>
                          {stock.ticker} · {stock.shares}주 · 평단 ₩{fmt(stock.avgPrice)}
                        </div>
                      </div>
                      <div style={{ display:"flex", gap:8 }}>
                        <button onClick={() => setEditStock({...stock})} style={{
                          background:"#1a2a45", border:"none", borderRadius:8,
                          padding:"6px 12px", color:C.blue, fontSize:11, fontWeight:700, cursor:"pointer",
                        }}>수정</button>
                        <button onClick={() => handleDelete(stock.id)} style={{
                          background:"#2a1a1a", border:"none", borderRadius:8,
                          padding:"6px 12px", color:C.red, fontSize:11, fontWeight:700, cursor:"pointer",
                        }}>삭제</button>
                      </div>
                    </div>
                    <div style={{ display:"flex", gap:6, marginTop:12, overflowX:"auto" }}>
                      {YEARS.map((y,i) => {
                        const prev = i>0?(stock.dividends[YEARS[i-1]]||0):null;
                        const cur  = stock.dividends[y]||0;
                        const up   = prev!==null && cur>prev;
                        const down = prev!==null && cur<prev;
                        return (
                          <div key={y} style={{ flex:"0 0 auto", background:C.dim, borderRadius:8,
                            padding:"6px 10px", minWidth:56, textAlign:"center",
                            border:`1px solid ${up?"#22c97444":down?"#f0606044":C.border}` }}>
                            <div style={{ fontSize:9, color:"#5a7090" }}>{y}</div>
                            <div style={{ fontSize:11, fontWeight:700,
                              color: up?C.green:down?C.red:"#c8d0e0" }}>
                              {cur>0?`₩${fmt(cur)}`:"-"}
                            </div>
                            {up   && <div style={{ fontSize:9, color:C.green }}>▲</div>}
                            {down && <div style={{ fontSize:9, color:C.red }}>▼</div>}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* ── GOALS ── */}
      {tab==="goals" && (
        <div style={{ padding:16 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
            <div style={{ fontSize:14, fontWeight:700 }}>목표 설정</div>
            <button onClick={() => { setEditGoals(!editGoals); setGoalDraft(goals); }} style={{
              background: editGoals?"#1a2a45":"linear-gradient(135deg,#4a90d9,#22c979)",
              border:"none", borderRadius:999, padding:"8px 18px",
              color: editGoals?"#8899bb":"#fff", fontSize:12, fontWeight:700, cursor:"pointer",
            }}>{editGoals?"취소":"수정"}</button>
          </div>
          {[
            { key:"annualDividend", label:"연간 배당 목표금액", icon:"💰", color:C.green, desc:"1년 동안 받고 싶은 총 배당금" },
            { key:"cash",          label:"현재 보유 현금",     icon:"💵", color:C.yellow, desc:"현재 투자 가능한 현금" },
            { key:"targetCash",    label:"현금 목표금액",      icon:"🎯", color:C.blue,  desc:"목표로 하는 현금 보유량" },
          ].map(({key,label,icon,color,desc}) => (
            <div key={key} style={{ background:C.card, borderRadius:16,
              padding:18, marginBottom:12, border:`1px solid ${C.border}` }}>
              <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:4 }}>
                <span>{icon}</span>
                <span style={{ fontSize:13, fontWeight:700 }}>{label}</span>
              </div>
              <div style={{ fontSize:10, color:"#5a7090", marginBottom:8 }}>{desc}</div>
              {editGoals ? (
                <input type="number" value={goalDraft[key]}
                  onChange={e => setGoalDraft({...goalDraft,[key]:Number(e.target.value)})}
                  style={{ width:"100%", background:C.dim, border:`1px solid ${color}55`,
                    borderRadius:10, padding:"10px 14px", color, fontSize:18,
                    fontWeight:800, boxSizing:"border-box" }} />
              ) : (
                <div style={{ fontSize:22, fontWeight:900, color }}>₩{fmt(goals[key])}</div>
              )}
            </div>
          ))}
          {editGoals && (
            <button onClick={() => { setGoals(goalDraft); setEditGoals(false); showToast(); }} style={{
              width:"100%", background:"linear-gradient(135deg,#4a90d9,#22c979)", border:"none",
              borderRadius:14, padding:14, color:"#fff", fontSize:14, fontWeight:800,
              cursor:"pointer", marginTop:4,
            }}>목표 저장</button>
          )}
          {!editGoals && (
            <div style={{ background:C.dim, borderRadius:16, padding:18,
              marginTop:8, border:`1px solid ${C.border}` }}>
              <div style={{ fontSize:12, color:"#6a8aaa", marginBottom:14 }}>📋 현황 요약</div>
              {[
                { label:"배당 목표 달성까지",
                  value:`₩${fmt(Math.max(0,goals.annualDividend-totalAnnualDividend))} 부족`, color:C.green },
                { label:"현금 목표까지",
                  value:`₩${fmt(Math.max(0,goals.targetCash-goals.cash))} 남음`, color:C.blue },
                { label:"목표 달성 예상",
                  value: totalAnnualDividend>0
                    ? `약 ${Math.ceil((goals.annualDividend-totalAnnualDividend)/(totalAnnualDividend*0.05))}년 후`
                    : "데이터 부족", color:C.yellow },
              ].map(({label,value,color}) => (
                <div key={label} style={{ display:"flex", justifyContent:"space-between",
                  alignItems:"center", padding:"10px 0", borderBottom:`1px solid #1a2540` }}>
                  <span style={{ fontSize:12, color:"#8899bb" }}>{label}</span>
                  <span style={{ fontSize:13, fontWeight:700, color }}>{value}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Footer */}
      <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)",
        width:"100%", maxWidth:480, background:C.bg,
        borderTop:`1px solid ${C.border}`, padding:"8px 0 16px",
        display:"flex", justifyContent:"center" }}>
        <div style={{ fontSize:10, color:"#2a3a55" }}>배당성장 트래커 v2.0 · 자동저장</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
